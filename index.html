<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WiFi Signal Wave Simulator</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="app">
        <div id="controls">
            <h1>WiFi Signal Wave Simulator</h1>
            <div class="control-group">
                <label>Frequency:</label>
                <input type="range" id="frequencySlider" min="1" max="10" step="0.1" value="5">
                <span id="frequencyValue">5 GHz</span>
            </div>
            <div class="control-group">
                <label>Signal Strength:</label>
                <input type="range" id="strengthSlider" min="0" max="100" value="75">
                <span id="strengthValue">75%</span>
            </div>
            <div class="control-group">
                <label>Wave Type:</label>
                <select id="waveTypeSelect">
                    <option value="sine">Sine Wave</option>
                    <option value="square">Square Wave</option>
                    <option value="triangle">Triangle Wave</option>
                </select>
            </div>
            <button id="simulateBtn">Simulate Wave</button>
        </div>
        <div id="visualizer"></div>
    </div>
    <script type="module" src="script.js"></script>

</body>
</html>
